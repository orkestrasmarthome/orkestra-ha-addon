# Home Assistant Add-on manifest template (canonical metadata for CI).
# The PUBLIC store copy lives in github.com/orkestrasmarthome/orkestra-ha-addon
# (orkestra/config.yaml). Monorepo CI syncs this file there after each image build.
# Docs: https://developers.home-assistant.io/docs/add-ons/configuration
name: Orkestra
version: "1.2.54"
slug: orkestra
description: Smart Home AI Dashboard
url: https://github.com/orkestrasmarthome/orkestra-ha-addon
arch:
  - aarch64
  - amd64
map:
  - data:rw
startup: application
boot: auto
init: false

# Serve the dashboard through Home Assistant Ingress (sidebar panel).
ingress: true
ingress_port: 3001
panel_icon: "mdi:home-lightning-bolt"
panel_title: "Orkestra"

# Allow the add-on to talk to the Home Assistant Core API
homeassistant_api: true

# User-configurable options (written to /data/options.json by the Supervisor)
options:
  home_assistant_url: "http://supervisor/core"
  home_assistant_token: ""
  orkestra_cloud_url: "https://api.orkestra-assistant.com"
  orkestra_portal_url: "https://app.orkestra-assistant.com"
  orkestra_instance_token: ""
schema:
  home_assistant_url: str
  home_assistant_token: str?
  orkestra_cloud_url: url
  orkestra_portal_url: str?
  orkestra_instance_token: password?

image: "ghcr.io/orkestrasmarthome/orkestra-core-{arch}"
